<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>官方入口信息</title>
  <meta name="description" content="官方入口信息页（合规内容）" />
  <style>
    :root{
      --bg:#f3f6fb;
      --card:rgba(255,255,255,.92);
      --text:#0f172a;
      --muted:#5b6b86;
      --line:rgba(15,23,42,.10);
      --soft:rgba(15,23,42,.04);
      --primary:#2563eb;
      --primary2:#1d4ed8;
      --shadow: 0 18px 45px rgba(2, 6, 23, .10);
      --radius:16px;

      /* 网址/邮箱更清晰：用正文系统字体（不是等宽） */
      --urlfont: ui-sans-serif, system-ui, -apple-system,
                 "Segoe UI", Roboto, Helvetica, Arial,
                 "PingFang SC","Noto Sans CJK SC","Microsoft YaHei", sans-serif;

      --sans: ui-sans-serif, system-ui, -apple-system,
              "Segoe UI", Roboto, Helvetica, Arial,
              "PingFang SC","Noto Sans CJK SC","Microsoft YaHei", sans-serif;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      color:var(--text);
      font-family: var(--sans);
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(37,99,235,.14), transparent 60%),
        radial-gradient(900px 500px at 85% 20%, rgba(29,78,216,.10), transparent 60%),
        linear-gradient(180deg, #f7f9ff, var(--bg));
    }
    .wrap{
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 16px 96px;
    }

    /* 顶部 */
    .header{
      position:relative;
      border-radius: calc(var(--radius) + 2px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.86));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .header::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(800px 240px at 20% 0%, rgba(37,99,235,.22), transparent 60%),
        radial-gradient(700px 240px at 80% 15%, rgba(16,185,129,.10), transparent 65%);
      filter: blur(18px);
      opacity:.9;
      pointer-events:none;
    }
    .header-top{
      position:relative;
      padding: 16px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 0;
    }
    .seal{
      width: 44px; height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1d4ed8, #60a5fa);
      display:grid; place-items:center;
      color:#fff;
      font-weight:800;
      letter-spacing:.6px;
      flex:0 0 auto;
      box-shadow: 0 12px 22px rgba(37,99,235,.20);
    }
    .brand h1{
      margin:0;
      font-size: 17px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .meta{
      font-size: 12px;
      color: var(--muted);
      white-space:nowrap;
      flex:0 0 auto;
    }
    .subbar{
      position:relative;
      padding: 10px 16px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      color: var(--muted);
      font-size: 12.5px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.85);
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: #22c55e;
      box-shadow: 0 0 0 6px rgba(34,197,94,.14);
    }

    /* 内容 */
    .grid{
      margin-top: 14px;
      display:grid;
      gap: 12px;
    }
    .card{
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 14px 34px rgba(2,6,23,.08);
      overflow:hidden;
    }
    .card-hd{
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.85));
    }
    .card-hd h2{
      margin:0;
      font-size: 14px;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .iconBadge{
      width:28px;height:28px;
      border-radius: 10px;
      display:grid;place-items:center;
      background: rgba(37,99,235,.10);
      border: 1px solid rgba(37,99,235,.20);
      color:#1d4ed8;
      font-size: 14px;
      flex:0 0 auto;
    }
    .card-bd{ padding: 14px 16px 16px; }

    .item{
      display:flex;
      gap:10px;
      align-items:center;
      padding: 12px 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.92);
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .item:last-child{ margin-bottom:0; }

    .url{
      flex:1 1 auto;
      min-width:0;
      font-family: var(--urlfont);
      font-size: 15px;
      line-height: 1.55;
      letter-spacing: .15px;
      color:#0b1220;
      word-break: break-all;
      padding: 2px 2px;
    }

    .btn{
      flex:0 0 auto;
      border: 1px solid rgba(37,99,235,.25);
      background: rgba(37,99,235,.10);
      color:#0b2a4a;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-size: 13px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .btn:hover{ background: rgba(37,99,235,.14); }

    /* 底部悬浮条 */
    .dock{
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      z-index: 9999;
      background: rgba(255,255,255,.92);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .dock-inner{
      max-width: 920px;
      margin: 0 auto;
      padding: 10px 16px;
      display:flex;
      justify-content:center;
    }
    .dock-btn{
      border: 0;
      background: linear-gradient(180deg, var(--primary), var(--primary2));
      color:#fff;
      padding: 13px 18px;
      border-radius: 14px;
      cursor:pointer;
      font-size: 13px;
      font-weight: 650;
      white-space:nowrap;
      box-shadow: 0 14px 26px rgba(37,99,235,.20);
    }
    .dock-btn:active{ transform: translateY(1px); }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      background: rgba(15,23,42,.88);
      color:#fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events:none;
      transition: .2s ease;
      max-width: calc(100% - 28px);
      z-index: 10000;
    }
    .toast.show{ opacity:1; }

    /* footer：保持你原来的行为（不改链接颜色逻辑） */
    footer{
      margin-top: 12px;
      text-align:center;
      font-size:.83rem;
      color:#7685a2;
      line-height:1.6;
      padding:12px 8px 16px;
      border-top: 1px solid var(--line);
      background: transparent;
    }
    footer a{color:inherit;text-decoration:none}
    footer a:hover{text-decoration:underline}
  </style>
</head>

<body>
  <div class="wrap">
    <section class="header">
      <div class="header-top">
        <div class="brand">
          <div class="seal">OFF</div>
          <div style="min-width:0">
            <h1>官方入口信息</h1>
            <div class="meta" id="today"></div>
          </div>
        </div>
        <div class="meta">仅供入口使用</div>
      </div>
      <div class="subbar">
        <div class="pill"><span class="dot"></span> 入口实时更新</div>
        <div class="meta">建议使用系统自带浏览器打开</div>
      </div>
    </section>

    <div class="grid" id="grid"></div>

    <footer>
      © 2025 Greenfield University — 501(c)(3) non-profit (EIN 12-3456789).<br>
      Registered with the New York State Board of Regents #2025-987654.<br>
      <a href="#">Privacy Policy</a> • <a href="#">Accessibility</a> • <a href="#">Terms of Use</a>
    </footer>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <button class="dock-btn" id="copyAll">一键复制全部保存到记事本</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DATA = [
      {
        title: "最新入口↓用这个进入（随时更新）",
        icon: "🔗",
        items: ["https://dfsgdd.akjh-cdn.55138w.baby"]
      },
      {
        title: "app下载地址（更丝滑）",
        icon: "⬇️",
        items: ["升级维护中……"]
      },
      {
        title: "永久地址（收藏不失联）",
        icon: "📌",
        items: ["https://55138.eth.limo","https://55138.eth.link"]
      },
      {
        title: "发送邮件获取最新地址（最稳）",
        icon: "✉️",
        items: ["admin@55138.org"]
      }
    ];

    const toastEl = document.getElementById('toast');
    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(()=>toastEl.classList.remove('show'), 1800);
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        toast("已复制 ✅ 请到手机自带浏览器打开");
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast("已复制 ✅ 请到手机自带浏览器打开");
      }
    }

    // ✅ 关键修复：避免链接里出现 & < " 等字符导致 innerHTML 结构被破坏（手机端常见“闪一下就消失”）
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function render(){
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth()+1).padStart(2,'0');
      const d = String(now.getDate()).padStart(2,'0');
      document.getElementById('today').textContent = `更新日期：${y}-${m}-${d}`;

      const grid = document.getElementById('grid');
      grid.innerHTML = "";

      DATA.forEach((sec, idx)=>{
        const card = document.createElement('section');
        card.className = "card";
        card.innerHTML = `
          <div class="card-hd">
            <h2><span class="iconBadge">${escapeHtml(sec.icon)}</span>${escapeHtml(sec.title)}</h2>
          </div>
          <div class="card-bd">
            ${sec.items.map((u,i)=>`
              <div class="item">
                <div class="url" id="c_${idx}_${i}">${escapeHtml(u)}</div>
                <button class="btn" data-copy="c_${idx}_${i}">复制</button>
              </div>
            `).join("")}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-copy]');
      if(!btn) return;
      const id = btn.getAttribute('data-copy');
      const el = document.getElementById(id);
      if(!el) return;
      const val = (el.textContent || "").trim();
      if (!val) return;
      copyText(val);
    });

    document.getElementById('copyAll').addEventListener('click', ()=>{
      const lines = [];
      DATA.forEach(sec=>{
        lines.push(`${sec.title}：`);
        sec.items.forEach(u => lines.push(u));
        lines.push("");
      });
      copyText(lines.join("\n").trim());
      toast("已复制全部地址 ✅ 请到手机自带浏览器打开");
    });

    render();
  </script>
</body>
</html>
